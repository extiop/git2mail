name: Deploy mdBook to GitHub Pages

permissions: {}

on:
  push:
    branches:
      - main

jobs:
  build:
    # pinned like the other workflows (one image moving under a run must be a visible decision)
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mdbook
        run: cargo install mdbook --locked --version 0.5.4

      - name: Build the book
        run: mdbook build ./doc

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./doc/book

  deploy:
    needs: build
    # pinned like the other workflows (one image moving under a run must be a visible decision)
    runs-on: ubuntu-26.04
    environment:
      name: github-pages # GitHub automatically uses this environment for Pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
