name: git2mail release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        build: [linux, macos, windows]
        include:
          - build: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cargo_arg: --release
          - build: macos
            os: macos-latest
            cargo_arg: --release
          - build: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            cargo_arg: --release
            extension: .exe

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
      with:
        toolchain: stable
    - name: Set target if any
      if: matrix.target
      run: rustup target add ${{ matrix.target }}
    - name: If target is musl, install musl-tools (including musl-gcc)
      if: matrix.target == 'x86_64-unknown-linux-musl'
      run: |
        sudo apt update
        sudo apt install musl-tools -y
    - name: Build
      run: cargo build ${{ matrix.cargo_arg }} --all-features --package git2mail --verbose ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
    - name: Prepare binary path
      id: binary_path
      shell: bash
      run: |
        if [ -n "${{ matrix.target }}" ]; then
          echo "path=./target/${{ matrix.target }}/release/git2mail${{ matrix.extension || '' }}" >> $GITHUB_OUTPUT
        else
          echo "path=./target/release/git2mail${{ matrix.extension || '' }}" >> $GITHUB_OUTPUT
        fi
    - name: Upload resulting 'git2mail'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: git2mail-${{ matrix.build }}
        path: ${{ steps.binary_path.outputs.path }}

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Query version number
        id: get_version
        shell: bash
        run: |
          echo "using version tag ${{ github.ref_name }}"
          echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get Changelog Entry
        id: changelog_reader
        uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31 # v2.4.0
        with:
          path: CHANGELOG.md
      - name: Download Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: git2mail-linux
          path: linux

      - name: Download macOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: git2mail-macos
          path: macos

      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: git2mail-windows
          path: windows

      - name: Create Release
        id: create_release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          release_name: git2mail-${{ steps.get_version.outputs.version }}
          body: ${{ steps.changelog_reader.outputs.changes }}
          draft: true

      - name: Release Linux artifact
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: linux/git2mail
          asset_name: git2mail-linux-static-${{ steps.get_version.outputs.version }}
          asset_content_type: application/octet-stream

      - name: Release macOS artifact
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: macos/git2mail
          asset_name: git2mail-macos-${{ steps.get_version.outputs.version }}
          asset_content_type: application/octet-stream

      - name: Release Windows artifact
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: windows/git2mail.exe
          asset_name: git2mail-windows-${{ steps.get_version.outputs.version }}.exe
          asset_content_type: application/octet-stream
