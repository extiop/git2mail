name: git2mail release

permissions:
  contents: write
  id-token: write
  attestations: write

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        build: [linux, macos, windows]
        include:
          - build: linux
            os: ubuntu-26.04
            # use a pinned Rust toolchain via a Linux container for reproducible builds
            container: rust@sha256:a8a5f0a1e5fe7dfe1d352591e4a1c7dd2c08fd70475cae872cf3458ba0df0546 # v1.98.1 : pin to known-good previous stable release for increased stability and security
            target: x86_64-unknown-linux-musl
            cargo_arg: --release
          - build: macos
            os: macos-26
            # not available: set container value to null
            container: null
            cargo_arg: --release
          - build: windows
            os: windows-2025-vs2026
            # not available: set container value to null
            container: null
            target: x86_64-pc-windows-msvc
            cargo_arg: --release
            extension: .exe

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    # install a toolchain only where no pinned container provides one: the
    # pinned image is the toolchain for the reproducible linux build
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      if: matrix.container == null
      with:
        # same version as the pinned container: the three legs build with
        # one toolchain, so a tag always ships from the same compiler
        toolchain: 1.98.1
    - name: Set target if any
      if: matrix.target
      run: rustup target add ${{ matrix.target }}
    - name: If target is musl, install musl-tools (including musl-gcc)
      if: matrix.container != null
      run: |
        apt-get update
        apt-get install -y musl-tools
    - name: Build
      run: cargo build ${{ matrix.cargo_arg }} --all-features --package git2mail --locked --verbose ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
    - name: Prepare binary path
      id: binary_path
      shell: bash
      run: |
        if [ -n "${{ matrix.target }}" ]; then
          echo "path=./target/${{ matrix.target }}/release/git2mail${{ matrix.extension || '' }}" >> $GITHUB_OUTPUT
        else
          echo "path=./target/release/git2mail${{ matrix.extension || '' }}" >> $GITHUB_OUTPUT
        fi
    - name: Upload resulting 'git2mail'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: git2mail-${{ matrix.build }}
        path: ${{ steps.binary_path.outputs.path }}

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - name: Query version number
        id: get_version
        shell: bash
        run: |
          echo "using version tag ${{ github.ref_name }}"
          echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Linux artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: git2mail-linux
          path: linux

      - name: Download macOS artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: git2mail-macos
          path: macos

      - name: Download Windows artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: git2mail-windows
          path: windows

      - name: Create Release
        id: create_release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          release_name: git2mail-${{ steps.get_version.outputs.version }}
          draft: true
          body: |
            ## Verification of assets

            This release's assets are built by GitHub Runners and are attested using [SLSA provenance](https://slsa.dev/spec/v1.0/provenance) (https://docs.github.com/en/actions/concepts/security/artifact-attestations).

            The attestation is generated from the GitHub workflow that built the release artifacts, and is cryptographically signed and logged by GitHub and Sigstore. You can verify it using a GitHub account or directly with [cosign](https://github.com/sigstore/cosign), as described below:

            ### With a GitHub account
            You can run:

            ```bash
            gh attestation verify --repo extiop/git2mail <asset-path>
            ```

            where `<asset-path>` is the file path to the downloaded asset.

            ### Without a GitHub account
            You can do it directly with [cosign](https://github.com/sigstore/cosign). First, download the attestation from https://github.com/extiop/git2mail/attestations to `attestation.json` (and not the one in the release). Then run:

            ```bash
            cosign verify-blob-attestation \
              --bundle attestation.json \
              --type https://slsa.dev/provenance/v1 \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity https://github.com/extiop/git2mail/.github/workflows/git2mail.yml@refs/tags/${{ steps.get_version.outputs.version }} \
              <asset-path>
            ```

            where `<asset-path>` is the file path to the downloaded asset.

            Changelog

            https://github.com/extiop/git2mail/blob/${{ steps.get_version.outputs.version }}/CHANGELOG.md

      - name: Release Linux artifact
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: linux/git2mail
          asset_name: git2mail-linux-static-${{ steps.get_version.outputs.version }}
          asset_content_type: application/octet-stream

      - name: Release macOS artifact
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: macos/git2mail
          asset_name: git2mail-macos-${{ steps.get_version.outputs.version }}
          asset_content_type: application/octet-stream

      - name: Release Windows artifact
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: windows/git2mail.exe
          asset_name: git2mail-windows-${{ steps.get_version.outputs.version }}.exe
          asset_content_type: application/octet-stream

      - name: Attest artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            linux/git2mail
            macos/git2mail
            windows/git2mail.exe

  publish:
    name: Publish git2mail
    needs: release
    runs-on: ubuntu-26.04
    # use a pinned Rust toolchain via a Linux container for reproducible builds
    container: rust@sha256:a8a5f0a1e5fe7dfe1d352591e4a1c7dd2c08fd70475cae872cf3458ba0df0546 # v1.98.1 : pin to known-good previous stable release for increased stability and security
    environment:
      name: cratesio
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish to crates.io
        # git2mail-core's FIRST release goes out by hand: crates.io cannot
        # attach a Trusted Publisher to a name that does not exist yet
        # (pending publishers are a deferred item in RFC 3691). Once core
        # exists and its trusted publisher is configured on crates.io, this
        # job publishes both crates - core first, then the CLI.
        run: cargo publish --package git2mail
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
