name: Build & test

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        build: [linux, macos, windows]
        include:
          - build: linux
            os: ubuntu-26.04
          - build: macos
            os: macos-26
          - build: windows
            os: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
            extension: .exe

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: stable
    - name: Set target if any
      if: matrix.target
      run: rustup target add ${{ matrix.target }}
    - name: Build
      env:
        RUSTFLAGS: ${{ matrix.target && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
      run: cargo build --locked --release --all-features --all --verbose ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
    - name: Run tests
      run: cargo test --locked --all --release --verbose ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
    - name: Upload resulting 'git2mail'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ matrix.build }}
        path: ${{ matrix.target && format('./target/{0}/release/git2mail{1}', matrix.target, matrix.extension || '') || format('./target/release/git2mail{0}', matrix.extension || '') }}

  wasm:
    # The web bindings' acceptance gate: the pure core and the bindings must
    # compile to wasm32-unknown-unknown without the HTTP stack (the site's
    # browser logic depends on it; core/src/lib.rs pins this claim).
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Check the wasm compilation of the core and the bindings
        run: cargo check --locked -p git2mail-core -p git2mail-wasm --target wasm32-unknown-unknown

  fmt:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt
      - name: Check format
        run: cargo fmt --all -- --check

  doc:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features --workspace

  audit:
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Security audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  clippy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings
