name: Ensure repository healthy state over time

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  changelog-format:
    # Ensure CHANGELOG respect the KeepAChangelog format
    strategy:
      matrix:
        changelog: [git2mail]
        include:
          - changelog: git2mail

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Get ${{ matrix.changelog }} Changelog Entry
      uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31 # v2.4.0
      id: changelog_reader
      with:
        # Check format for the last 10 entries
        validation_depth: 10
        path: CHANGELOG.md
    - name: Information
      # the reader's outputs come from CHANGELOG.md, an editable file:
      # route them through the environment instead of interpolating them
      # into the script (a crafted changelog line could otherwise execute)
      env:
        CHANGELOG_VERSION: ${{ steps.changelog_reader.outputs.version }}
        CHANGELOG_STATUS: ${{ steps.changelog_reader.outputs.status }}
        CHANGELOG_CHANGES: ${{ steps.changelog_reader.outputs.changes }}
      run: |
          printf '\033[1mVersion\033[0m %s\n' "$CHANGELOG_VERSION"
          printf '\033[1mStatus\033[0m %s\n' "$CHANGELOG_STATUS"
          printf '\033[1mBody\033[0m\n'
          printf '%s\n' "$CHANGELOG_CHANGES"
